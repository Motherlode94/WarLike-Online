name = "warlike-online"
main = "src/index.js"
compatibility_date = "2026-11-08"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

# Replace placeholders with the actual Cloudflare resources.
[[d1_databases]]
binding = "DB"
database_name = "warlike-online"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "warlike-online-media"
